# gear.ddoaudit.com: the Gear Optimizer (separate repo, ddo-gear-optimizer; see its docs/DEPLOY.md).
# Static web build from the host's /var/www/gear.ddoaudit.com/site (mounted at /srv/gear), and /api/ proxied to the
# optimizer API, which runs as its own compose project ("gear") on the ddoaudit_backend network as gear-api:8000.

# Per-IP request limit on the optimizer API (the app has its own per-client limits behind this).
limit_req_zone $binary_remote_addr zone=gear_api:10m rate=10r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gear.ddoaudit.com;

    # ACME challenge (HTTP)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gear.ddoaudit.com;

    ssl_certificate /etc/letsencrypt/live/ddoaudit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddoaudit.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ddoaudit.com/chain.pem;

    # Strong TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/gear-headers.conf;
    server_tokens off;

    include /etc/nginx/denylist.d/*.conf;

    # Preview: password until public launch. Delete these two lines to open the site to everyone.
    auth_basic "Gear Optimizer preview";
    auth_basic_user_file /srv/gear/htpasswd;

    root /srv/gear/html;
    index index.html;

    # The optimizer API. Resolved per request through Docker's DNS, so nginx (and the rest of ddoaudit.com) still
    # starts when gear-api is down or absent (stage); gear requests then get a 502.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gear_api http://gear-api:8000;

        limit_req zone=gear_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 8m;

        proxy_pass $gear_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hashed build files (scripts, styles, the solver worker): cache for good.
    location ^~ /assets/ {
        include /etc/nginx/snippets/gear-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # The WebAssembly solver keeps fixed names, so browsers revalidate it (ETag) instead of caching it for good.
    location ^~ /wasm/ {
        types {
            application/wasm wasm;
            text/javascript js;
        }
        include /etc/nginx/snippets/gear-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ACME challenge (HTTPS; HTTP is primary for http-01)
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        default_type "text/plain";
        root /acme-challenge;
        try_files $uri =404;
    }

    # The single-page app: unknown paths get index.html, which is always revalidated.
    location / {
        include /etc/nginx/snippets/gear-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Compression (the solver models from /api/model and the .wasm file compress about 3x)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}
